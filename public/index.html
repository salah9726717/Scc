<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Sophia Company</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="is-home">
  <main class="app-shell">
    <header class="topbar">
      <span class="brand-name">Sophia Company</span>
      <span class="welcome-badge"><span class="welcome-dot"></span> Welcome</span>
    </header>

    <section class="page-area" id="page-area" aria-live="polite">
      <section class="user-card" aria-label="User account information">
        <div class="user-card-top">
          <div class="user-avatar" id="user-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"></path></svg>
          </div>
          <div class="user-main">
            <h2 id="user-name">Profile</h2>
            <p id="user-username">@username</p>
            <p class="telegram-id">Telegram ID: <strong id="user-id">—</strong></p>
          </div>
          <span class="account-status"><span></span> Active</span>
        </div>
      </section>
      <section class="account-summary-cards" aria-label="Account summary">
        <article class="summary-card">
          <span class="summary-label">ACTIVE BALANCE</span>
          <strong class="summary-value" id="user-balance">$0</strong>
        </article>
        <article class="summary-card">
          <span class="summary-label">ACTIVE TASKS</span>
          <strong class="summary-value" id="user-tasks">0/0</strong>
        </article>
      </section>
      <button type="button" class="withdraw-btn" id="home-withdraw-btn" data-go-page="withdrawals">
        <span>Withdraw</span>
      </button>
      <button type="button" class="invite-promo" id="home-invite-card">
        <span class="invite-promo-label">INVITE &amp; SHARE</span>
        <strong class="invite-promo-title">Invite friends, earn together</strong>
        <span class="invite-promo-desc">Share your personal invite link with friends and earn a reward when your invited friend becomes successful.</span>
      </button>
      <section class="more-info" aria-label="More info">
        <h2 class="more-info-title">More Info</h2>
        <div class="more-info-body">
          <span class="more-info-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M21.5 3.6 2.9 10.8c-.8.3-.8 1.4 0 1.7l4.6 1.6 1.8 5.5c.2.6 1 .8 1.4.3l2.6-2.5 4.7 3.5c.6.4 1.4.1 1.6-.6l3.1-15.1c.2-.9-.7-1.6-1.2-1.1ZM9.2 13.6l8.4-5.2-6.5 6.2-.3 3.2-1.6-4.2Z"/></svg>
          </span>
          <p class="more-info-desc">Join our official Telegram channel to get the latest news, updates and announcements from Sophia Company.</p>
          <button type="button" class="more-info-open" id="home-news-btn">Open</button>
        </div>
      </section>
    </section>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-page="home" aria-current="page">
        <span class="icon-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.2 10.4 7.5-6.1a2.1 2.1 0 0 1 2.6 0l7.5 6.1"/><path d="M5.3 9.2v9.4a2 2 0 0 0 2 2h9.4a2 2 0 0 0 2-2V9.2"/><path d="M9.1 20.6v-6.1a1.2 1.2 0 0 1 1.2-1.2h3.4a1.2 1.2 0 0 1 1.2 1.2v6.1"/></svg></span>
        <span>Home</span>
      </button>
      <button class="nav-item" data-page="tasks">
        <span class="icon-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.2" y="3.2" width="15.6" height="17.6" rx="3"/><path d="M8 8.4h1.1l.8.9 1.5-1.8M13.8 8.7h2.5M8 13.2h1.1l.8.9 1.5-1.8M13.8 13.5h2.5M8 17.6h8.3"/></svg></span>
        <span>Tasks</span>
      </button>
      <button class="nav-item" data-page="invite">
        <span class="icon-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.1"/><path d="M3.4 19.8v-1.1a4.2 4.2 0 0 1 4.2-4.2h2.8a4.2 4.2 0 0 1 4.2 4.2v1.1"/><path d="M17.2 7.1a2.8 2.8 0 0 1 0 5.4M17.1 14.8h.7a3.1 3.1 0 0 1 3.1 3.1v1.9M18.8 4.1v5.8M15.9 7h5.8"/></svg></span>
        <span>Invite</span>
      </button>
      <button class="nav-item" data-page="withdrawals">
        <span class="icon-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.2" width="18" height="14.6" rx="3"/><path d="M3.4 9.4h17.2"/><path d="M15.1 14.4h2.6"/><path d="M7 5.2V4.4a1.7 1.7 0 0 1 1.7-1.7h9.1a1.7 1.7 0 0 1 1.7 1.7v.8"/><path d="M7.1 15.4h3.1"/></svg></span>
        <span>Withdrawals</span>
      </button>
    </nav>
  </main>
  <script src="app.js"></script>
</body>
</html>
